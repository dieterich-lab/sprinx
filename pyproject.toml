[project]
name = "sprinx"
version = "0.1.0"
description = "Sprinzl-coordinate annotation for mitochondrial tRNAs"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "biopython",
    "loguru",
    "ViennaRNA",
    "forgi",
]

[project.scripts]
sprinx = "sprinx.cli:main"

[project.optional-dependencies]
# extra dependency for the standalone scripts/visualize_ss.py; not needed for
# the core package (see its docstring for why visualization is kept separate).
viz = ["cairosvg"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprinx"]
artifacts = ["src/sprinx/data/**"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# extend-select, not select: ruff enables ~414 rules by default and `select`
# would replace that set rather than add to it.
extend-select = [
    "W292",     # missing newline at end of file
    "C90",      # mccabe cyclomatic complexity
    "C4",       # flake8-comprehensions
    "ERA",      # commented-out code
    "FBT",      # boolean positional/default args
    "PLR0913",  # too many arguments
]
ignore = ["E701"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
