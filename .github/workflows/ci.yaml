name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the conserved-position test compares against alignments from this
      # version of cmalign, so it is pinned rather than taken from apt
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: infernal
          create-args: infernal=1.1.5
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra test

      - name: pytest
        shell: bash -el {0}
        run: uv run pytest -q
